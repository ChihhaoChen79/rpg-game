<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>像素冒險</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #000; touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; overscroll-behavior: none; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; image-rendering: pixelated; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #111;
        color: #eee; font: 20px sans-serif; align-items: center; justify-content: center;
        text-align: center; padding: 24px; box-sizing: border-box; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      #update { display: none; position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
        z-index: 20; background: #223; color: #fff; border: 1px solid #889; padding: 8px 12px;
        font: 14px sans-serif; border-radius: 4px; }
      #update button { margin-left: 8px; }
      #boot-fail { display: none; position: fixed; inset: 0; z-index: 30; background: #111; color: #eee;
        font: 16px sans-serif; align-items: center; justify-content: center; flex-direction: column;
        text-align: center; padding: 24px; box-sizing: border-box; gap: 12px; }
      #boot-fail small { color: #999; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">請將裝置轉為橫向</div>
    <div id="update"><span>有新版本可用</span><button type="button">重新載入</button></div>
    <div id="boot-fail">
      <div>遊戲載入失敗，請重新整理頁面。</div>
      <small>開發者：若在 GitHub Pages 上看到此訊息，代表網站提供的是原始碼而非建置結果。請將 Pages 的來源設為「GitHub Actions」（見 docs/DEVELOPMENT.md）。</small>
    </div>
    <script>
      // Shown only if the game never starts, e.g. raw source served instead of the build.
      // Plain inline script on purpose: it must work even when the module bundle doesn't load.
      setTimeout(function () {
        if (!document.querySelector('#game canvas')) document.getElementById('boot-fail').style.display = 'flex';
      }, 6000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
