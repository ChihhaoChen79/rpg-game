<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>像素冒險</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #000; touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; overscroll-behavior: none; }
      /* Inside the safe area: keeps the UI clear of the Dynamic Island / notch and rounded corners. */
      #game { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); }
      #game canvas { display: block; image-rendering: pixelated; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #111;
        color: #eee; font: 20px sans-serif; align-items: center; justify-content: center;
        text-align: center; padding: 24px; box-sizing: border-box; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      #update { display: none; position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
        z-index: 20; background: #223; color: #fff; border: 1px solid #889; padding: 8px 12px;
        font: 14px sans-serif; border-radius: 4px; }
      #update button { margin-left: 8px; }
      #boot-fail { display: none; position: fixed; inset: 0; z-index: 30; background: #111; color: #eee;
        font: 16px sans-serif; align-items: center; justify-content: center; flex-direction: column;
        text-align: center; padding: 24px; box-sizing: border-box; gap: 12px; }
      #boot-fail small { color: #999; font-size: 12px; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #888; font: 16px sans-serif; z-index: 5; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">載入中…</div>
    <div id="rotate">請將裝置轉為橫向</div>
    <div id="update"><span>有新版本可用</span><button type="button">重新載入</button></div>
    <div id="boot-fail">
      <div>遊戲載入失敗，請重新整理頁面。</div>
      <small>開發者：若在 GitHub Pages 上看到此訊息，代表網站提供的是原始碼而非建置結果。請將 Pages 的來源設為「GitHub Actions」（見 docs/DEVELOPMENT.md）。</small>
    </div>
    <script>
      // The failure message is shown only when the game really can't start: a script failed to
      // download, or the code ran but no game appeared. A slow first download (e.g. the home-screen
      // app on 4G, which doesn't share Safari's cache) just keeps showing 載入中….
      // Plain inline script on purpose: it must work even when the module bundle doesn't load.
      (function () {
        var failed = false;
        function fail() {
          if (failed || document.querySelector('#game canvas')) return;
          failed = true;
          document.getElementById('loading').style.display = 'none';
          document.getElementById('boot-fail').style.display = 'flex';
        }
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && el.tagName === 'SCRIPT') fail(); // the game bundle didn't download
        }, true);
        var waited = 0;
        var timer = setInterval(function () {
          waited += 1;
          if (document.querySelector('#game canvas')) return clearInterval(timer);
          // The bundle ran (window.__gameStarting) but made no game in 8 s, or nothing after 60 s.
          if ((window.__gameStarting && waited >= 8) || waited >= 60) {
            clearInterval(timer);
            fail();
          }
        }, 1000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
